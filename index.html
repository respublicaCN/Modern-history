<!doctype html>
<html>
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width initial-scale=1'>
<title>index</title>
</head>
<body><svg viewBox="0 -30 600 600" width="800" height="600" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" style="font-family: sans-serif; display: block; margin: 20px auto; background-color: #fafafa; border-radius: 8px;">
  <!-- [x="X" y="Y"]与0-1象限(a,b)换算公式如下：X = 80 + 440a, Y = 520 - 440b -->
  <!-- ==================== 1. 图表标题 ==================== -->
  <!-- x是居中位置，y是高度位置-->
  <text x="300" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    Typology of Idiosyncratic Subjectivity
  </text>
  <!-- ==================== 2. 坐标十字轴线 ==================== -->
  <!-- 水平横轴 (X轴) x是左右顶点，y是高度上限（不变）-->
  <line x1="80" y1="300" x2="520" y2="300" stroke="#aaa" stroke-width="1.5" />
  <!-- 垂直纵轴 (Y轴) y是上下顶点，x是宽度上限（不变）-->
  <!-- Y轴原定上80下520，出于美观调整为上100下500-->
  <line x1="300" y1="100" x2="300" y2="500" stroke="#aaa" stroke-width="1.5" />
  <!-- ==================== 3. 坐标轴两端标签 ==================== -->
  <g font-size="12" font-weight="600" fill="#061321">
  	<!-- X轴：左端与右端 x比横轴端点各增减10，y高度上限不变（核心定点300轴对称）-->
  	<!-- 中文部分，x轴+/-30，y高度中英文分别调整10（为了视觉效果）-->
 		<text x="70" y="290" text-anchor="end"> Low Political Acuteness </text>
  	<text x="40" y="310" text-anchor="end"> 低政治敏锐度 </text>
  	<text x="530" y="290" text-anchor="start"> High Political Acuteness </text>
  	<text x="560" y="310" text-anchor="start"> 高政治敏锐度 </text>
  	<!-- Y轴：顶端与底端 y比纵轴端点各增减10，x位置上限不变（核心定点300轴对称）-->
    <!-- 中文部分，y轴+/-30（底线基准+/-10与轴线100-500），x高度中英文分别调整10（为了视觉效果）-->
  	<text x="300" y="70" text-anchor="middle"> High Moral Cultivation </text>
  	<text x="300" y="90" text-anchor="middle"> 高道德修养 </text>
  	<text x="300" y="515" text-anchor="middle"> Low Moral Cultivation </text>
    <text x="300" y="535" text-anchor="middle"> 低道德修养 </text>
  <!--  ================= 4. 四个象限居中背景水印  ================= -->
  <!-- opacity 代表透明度：0.10 ~ 0.15 较为合适，字号可由 font-size 调整 -->
  <g font-size="14" font-weight="bold" font-style="italic" opacity="0.2" text-anchor="middle" dominant-baseline="middle">
  	<!-- x是横轴，与轴线(x=300)差值+/-120 -->
    <!-- y是纵轴，与轴线(y=300)差值+/-100 -->
    <!-- 第二象限（左上）低敏锐/低道德 Apolitical Moralist -->
    <text x="180" y="200" fill="#e34a62"> Prophetic Intellectual </text>
    <!-- 第一象限（右上）高敏锐/高道德 Ethical Realist -->
    <text x="420" y="200" fill="#e34a62"> Disengaged Scholastic </text>
    <!-- 第三象限（左下）低敏锐低道德 Disengaged Transgressor -->
    <text x="180" y="400" fill="#e34a62"> Marginal Iconoclast </text>
    <!-- 第四象限（右下）高敏锐低道德 Machiavellian Pragmatist -->
    <text x="420" y="400" fill="#e34a62"> Pragmatic Bureaucrat </text>
    <text x="420" y="410" fill="#e1a6b3"> </text>
  </g>
  <!-- ============== 5. 角色点位区（未来添加/修改只需在这里）============== -->
  <!-- g 是角色的总设定，字体、字号，fill 是颜色 -->
  <!-- circle 代表标记圆点：cx 是水平位置，cy 是垂直位置，r 是圆点半径大小 -->
  <!-- text 代表名字标签：x 建议比 cx 大 8-10 像素，y 比 cy 大 4 像素以实现视觉对齐 -->
  <g font-size="12" font-weight="400" fill="#95263e">
    <!-- 张君劢: [0.59, 0.65] -->
      <g id="zhang-junmai">
        <circle cx="330" cy="230" r="4"/>
        <text x="340" y="234"> Carsun Chang </text>
      </g>
    <!-- 张嘉璈: [0.80, 0.25] -->
      <g id="zhang-jiaao">
        <circle cx="422" cy="346" r="4"/>
        <text x="432" y="350"> Kaingau Chang </text>
      </g>
    <!-- 张东荪: [0.20, 0.70] -->
      <g id="zhang-dongsun">
        <circle cx="158" cy="146" r="4"/>
        <text x="168" y="150"> Chang Tung-sheng </text>
      </g>
    <!-- 梁启超: [0.90, 0.80] -->
      <g id="liang-qichao">
        <circle cx="466" cy="164" r="4"/>
        <text x="476" y="168"> Liang Chi-chao </text>
      </g>
    <!-- 李璜: [0.40, 0.55] -->
      <g id="li-huang">
        <circle cx="246" cy="274" r="4"/>
        <text x="256" y="278"> Li Huang </text>
      </g>
    <!-- 曾琦: [0.70, 0.65] -->
      <g id="zeng-qi" >
        <circle cx="378" cy="256" r="4"/>
        <text x="388" y="260"> Tseng Chi </text>
      </g>
    <!-- 左舜生: [0.60, 0.15] -->
      <g id="zuo-shunsheng">
        <circle cx="334" cy="450" r="4"/>
        <text x="344" y="454"> Tso Shun-sheng </text>
      </g>
    <!-- 徐寄庼: [0.32, 0.86]-->
      <g id="xu-jiqin">
        <circle cx="212" cy="136" r="4"/>
        <text x="222" y="140"> Hsu Chi-ching </text>
      </g>
    <!-- 黄群: [0.72, 0.84] -->
      <g id="huang-qun">
        <circle cx="388" cy="146" r="5.5" />
        <text x="398" y="150"> Huang Chun </text>
      </g>
    <!-- 汤芗铭: [0.17, 0.14] -->
      <g id="tang-xiangming">
        <circle cx="146" cy="454" r="5.5"/>
        <text x="156" y="458"> Tang Hsiang-ming </text>
      </g>
    <!-- 汤化龙: [0.84, 0.16] -->
      <g id="tang-hualong">
        <circle cx="440" cy="444" r="5.5"/>
        <text x="450" y="450"> Tang Hua-lung </text>
      </g>
	<!-- ==================== 6. 图表标注 ==================== -->
  <!-- x是居中位置，y是高度位置-->
  <text x="300" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    Typology of Idiosyncratic Subjectivity
  </text>
</svg>
<p>&nbsp;</p>
</body>
</html>
